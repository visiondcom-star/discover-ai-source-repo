name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discoverai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/discoverai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
        run: |
          pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build
        working-directory: ./frontend
        run: npm run build
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Configure minimal backend env for docker compose
        run: |
          cat > backend/.env <<'EOF'
          SECRET_KEY=ci-secret-for-tests
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=1440
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-4o
          EMBEDDING_MODEL=text-embedding-3-small
          DEFAULT_TENANT_SLUG=algeria
          EOF
      - name: Run Playwright E2E via docker compose (full stack)
        run: docker compose --profile test run --rm playwright

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
      - name: Get dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Run tests
        working-directory: ./mobile
        run: flutter test --coverage
      # NOTE: `flutter build apk` disabled — the mobile module has no android/
      # platform scaffold in this repo, so an APK build always fails on CI.
      # If a real APK is required, run `flutter create --platforms=android .`
      # in ./mobile and commit the generated android/ directory first.

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-e2e, flutter-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t discover-ai-backend:latest ./backend
      - name: Build frontend image
        run: docker build -t discover-ai-frontend:latest ./frontend