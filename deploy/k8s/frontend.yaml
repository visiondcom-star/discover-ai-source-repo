apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: discover-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: discover-ai-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.your-domain.com"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: discover-ai
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
