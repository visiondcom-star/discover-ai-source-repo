entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

api:
  insecure: true
  dashboard: true

providers:
  docker:
    exposedByDefault: false

certificates:
  - certFile: /certs/localhost.crt
    keyFile: /certs/localhost.key

log:
  level: DEBUG