apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: discover-ai
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: BACKEND_URL
              value: "https://staging-api.your-domain.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: discover-ai
spec:
  replicas: 1
