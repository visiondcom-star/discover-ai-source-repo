# Production stack: Traefik (TLS + Let's Encrypt) → frontend + API,
# Postgres (pgvector) + Redis on an internal network.
#
# Every environment-specific value comes from --env-file .env.production
# (template: .env.production.example). Domains, secrets and credentials are
# NEVER hardcoded here.
#
# Launch:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP to HTTPS.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (ACME TLS challenge). While testing DNS/certs, point
      # ACME_CA_SERVER at the staging directory to spare production rate
      # limits: https://acme-staging-v02.api.letsencrypt.org/directory
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      # Dashboard intentionally NOT exposed (no --api.insecure).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - edge

  db:
    build:
      context: ./deploy/postgres # pgvector/pgvector:pg16 + discoverai_test bootstrap
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-discoverai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-discoverai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published: reachable only from the internal network.
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-discoverai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Deliberately NOT `${SECRET_KEY:?...}`: an unset/default SECRET_KEY must
      # reach the application so the Pydantic production guard refuses to boot
      # with an explicit, actionable error (see app/config.py).
      SECRET_KEY: ${SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      USE_PGVECTOR: "true"
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-algeria}
      # Pass-through like SECRET_KEY: a missing or wildcard CORS_ORIGINS must
      # reach the app guard and crash startup with its explicit error message
      # instead of failing earlier inside compose interpolation.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN:?API_DOMAIN required}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.api-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.api-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.api-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.api-headers.headers.frameDeny=true"
      - "traefik.http.routers.backend.middlewares=api-headers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations run in the entrypoint before uvicorn binds the port.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - internal

  frontend:
    build:
      context: ./frontend
      target: runner # multi-stage Dockerfile: standalone Next.js server, non-root
    environment:
      # Rewrites are baked at image build time (next.config.mjs); this mirrors
      # the in-network API address for parity with the dev stack.
      BACKEND_URL: http://backend:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:?DOMAIN required}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.web-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.web-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.web-headers.headers.contentTypeNosniff=true"
      - "traefik.http.routers.frontend.middlewares=web-headers"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:
  letsencrypt:

networks:
  edge: # Traefik <-> backend/frontend (internet-facing)
  internal: # db/redis <-> backend only
