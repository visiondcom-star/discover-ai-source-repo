name: discover_ai
version: 1.0.0+1
publish_to: none
description: Discover AI - Multi-Tenant Travel Platform

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  # JWT storage: iOS Keychain / Android Keystore. Never SharedPreferences.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Web E2E verification harness (flutter drive -d chrome).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true