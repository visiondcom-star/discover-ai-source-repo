apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: discover-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: discover-ai-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:$(DB_PASSWORD)@postgres:5432/discoverai"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: discover-ai-secrets
                  key: SECRET_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: discover-ai-secrets
                  key: OPENAI_API_KEY
          envFrom:
            - secretRef:
                name: discover-ai-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: discover-ai
spec:
  selector:
    app: backend
  ports:
    - port: 8000
