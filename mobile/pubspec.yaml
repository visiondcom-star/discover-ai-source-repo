name: discover_ai
version: 1.0.0+1
publish_to: none
description: Discover AI - Multi-Tenant Travel Platform

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  # JWT storage: iOS Keychain / Android Keystore. Never SharedPreferences.
  flutter_secure_storage: ^9.2.2
  # Map: flutter_map 8.3.1 is the latest stable; requires Dart >=3.6 /
  # Flutter >=3.27 (project runs Flutter 3.47 / Dart 3.13). Verified against
  # pub.dev before pinning.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Deterministic clock for debounce/timer tests — no wall-clock sleeps.
  fake_async: ^1.3.1
  # Web E2E verification harness (flutter drive -d chrome).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Poppins — brand typeface from the "Discover AI" UX blueprint
  # (weights used by the design system: Medium 500, SemiBold 600, Bold 700).
  # Bundled as assets (no runtime fetch, deterministic tests). License: OFL,
  # see assets/fonts/OFL-LICENSE.txt.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700